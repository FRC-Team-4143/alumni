{% extends "public/base.html" %}
{% block title %}{{ newsletter.title }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mb-3">
  <div>
    <a href="/newsletters" class="text-muted small d-block mb-1"><i class="bi bi-arrow-left me-1"></i> Archive</a>
    <h3 class="mb-1">{{ newsletter.title }}</h3>
    <p class="text-muted mb-0">{{ newsletter.published_date.strftime('%B %Y') }}</p>
  </div>
  <a class="btn btn-outline-secondary btn-sm" href="/newsletter-files/{{ newsletter.filename }}" target="_blank">
    <i class="bi bi-box-arrow-up-right me-1"></i> Open in new tab
  </a>
</div>
<div class="card">
  <div class="card-body p-0">
    <embed src="/newsletter-files/{{ newsletter.filename }}" type="application/pdf" style="width: 100%; height: 80vh; border-radius: 10px;">
  </div>
</div>
{% endblock %}
