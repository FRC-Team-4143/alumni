{% extends "public/base.html" %}
{% block title %}Newsletter Archive{% endblock %}

{% block content %}
<h3 class="mb-3">Newsletter Archive</h3>
<div class="list-group">
  {% for n in newsletters %}
  <a href="/newsletters/{{ n.id }}"
     class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
     style="background: #111111; border-color: #2a1a1a; color: #f0e8e8;">
    <span>{{ n.title }}</span>
    <span class="text-muted small">{{ n.published_date.strftime('%B %Y') }}</span>
  </a>
  {% else %}
  <div class="card"><div class="card-body text-center text-muted py-5">No newsletters published yet.</div></div>
  {% endfor %}
</div>
{% endblock %}
