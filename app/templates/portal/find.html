{% extends "portal/base.html" %}
{% block title %}Find my link — Alumni{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <h5 class="card-title mb-3">Lost your update link?</h5>
    <p class="text-muted">
      Enter the email address you gave us when you filled out the survey, and if it's
      on file we'll send a fresh copy of your personal link to it.
    </p>
    <form method="post" action="/survey/find">
      <div class="mb-3">
        <label class="form-label" for="email">Email address</label>
        <input class="form-control" type="email" id="email" name="email" required autofocus>
      </div>
      <button class="btn btn-primary" type="submit">Email me my link</button>
    </form>
  </div>
</div>
{% endblock %}
