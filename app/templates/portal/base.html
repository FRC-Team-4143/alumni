<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Alumni{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: #0a0a0a; color: #f0e8e8; }
    :root, [data-bs-theme="dark"] {
      --bs-primary: #cc2200; --bs-primary-rgb: 204, 34, 0;
      --bs-link-color: #e05540; --bs-link-color-rgb: 224, 85, 64;
      --bs-link-hover-color: #ff6644; --bs-focus-ring-color: rgba(204, 34, 0, 0.25);
    }
    .brand { color: #cc2200; font-weight: 700; font-style: italic; letter-spacing: .5px; }
    .card { background: #111111; border: 1px solid #2a1a1a; border-radius: 10px; box-shadow: none; }
    .card-header { background: #1a0f0f; border-bottom: 1px solid #2a1a1a; color: #cc2200; font-weight: 600; }
    .btn-primary {
      --bs-btn-bg: #cc2200; --bs-btn-border-color: #cc2200;
      --bs-btn-hover-bg: #aa1c00; --bs-btn-hover-border-color: #aa1c00;
      --bs-btn-active-bg: #991900; --bs-btn-active-border-color: #991900;
    }
    .text-muted { color: #9a7878 !important; }
    .form-control, .form-select { background: #0d0d0d; border-color: #2a1a1a; color: #f0e8e8; }
    .form-control:focus, .form-select:focus { background: #0d0d0d; border-color: #cc2200; color: #f0e8e8; box-shadow: none; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<div class="py-3 px-3 mb-4" style="background:#111111; border-bottom:1px solid #2a1a1a;">
  <span class="brand">Alumni</span>
</div>
<main class="container pb-5" style="max-width: 560px;">
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
