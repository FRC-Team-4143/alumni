<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Alumni{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/marswars.css">
  <style>
    .brand { color: #cc2200; font-weight: 700; font-style: italic; letter-spacing: .5px; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<div class="py-3 px-3 mb-4" style="background:#111111; border-bottom:1px solid #2a1a1a;">
  <span class="brand">Alumni</span>
</div>
<main class="container pb-5" style="max-width: 560px;">
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
